name: Tests and dependency audit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LAB_FONT_SONG: /usr/share/fonts/truetype/arphic/uming.ttc
      LAB_FONT_HEI: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      LAB_FONT_LATIN: /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-arphic-uming fonts-wqy-zenhei fonts-liberation
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js && node --check static/privacy.js && node --check static/math.js && node --test tests/*.test.cjs
      - run: pip-audit -r requirements.txt
